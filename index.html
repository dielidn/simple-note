<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Заметки</title>
<meta name="description" content="Заметки-карточки: максимум 14 штук, срок жизни 7 дней.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заметки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d3d3da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd954'/%3E%3Cg fill='%23221d0b' opacity='.82'%3E%3Crect x='15' y='21' width='34' height='5' rx='2.5'/%3E%3Crect x='15' y='30' width='34' height='5' rx='2.5'/%3E%3Crect x='15' y='39' width='21' height='5' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Материал матовый, а не глянцевый: глубина берётся из мягкой рассеянной
     тени (--lift) и тонкой светлой кромки (--edge). Никаких бликов,
     тиснения и зерна — от них дизайн стареет. */
  :root {
    --bg: #d3d3da;
    --bg-top: #dedee4;
    --bg-bottom: #c8c8d0;
    --ink: #17171a;
    --muted: #575760;
    --panel: rgba(255,255,255,.66);
    --panel-solid: #eeeef2;
    --chrome: rgba(228,228,236,.72);
    --chrome-solid: #e2e2e9;
    --hair: rgba(23,23,26,.10);
    --fill: rgba(23,23,26,.06);
    --fill-2: rgba(23,23,26,.11);
    --accent: #0a7cff;
    --danger: #ff3b30;
    --card-ink: #1c1c1e;
    --ctl: #1d1d21;
    --ctl-ink: #ffffff;

    --lift: 0 1px 1.5px rgba(23,23,26,.05), 0 6px 14px -4px rgba(23,23,26,.10), 0 22px 40px -14px rgba(23,23,26,.16);
    --lift-sm: 0 1px 1.5px rgba(23,23,26,.05), 0 4px 10px -3px rgba(23,23,26,.10);
    --lift-ctl: 0 1px 2px rgba(23,23,26,.16), 0 8px 18px -4px rgba(23,23,26,.28);
    --edge: inset 0 0 0 .5px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --bg-top: #1c1c21;
      --bg-bottom: #0d0d10;
      --ink: #f2f2f7;
      --muted: #9a9aa3;
      --panel: rgba(64,64,72,.5);
      --panel-solid: #222227;
      --chrome: rgba(28,28,34,.62);
      --chrome-solid: #1a1a1f;
      --hair: rgba(255,255,255,.11);
      --fill: rgba(255,255,255,.07);
      --fill-2: rgba(255,255,255,.13);
      --accent: #4da2ff;
      --danger: #ff453a;
      --card-ink: #f2f2f7;
      --ctl: #f2f2f7;
      --ctl-ink: #17171a;

      --lift: 0 1px 2px rgba(0,0,0,.4), 0 8px 18px -4px rgba(0,0,0,.45), 0 26px 46px -16px rgba(0,0,0,.55);
      --lift-sm: 0 1px 2px rgba(0,0,0,.4), 0 5px 12px -3px rgba(0,0,0,.4);
      --lift-ctl: 0 1px 2px rgba(0,0,0,.5), 0 8px 20px -4px rgba(0,0,0,.6);
      --edge: inset 0 0 0 .5px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.13);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg) linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--ink);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  body.locked { position: fixed; left: 0; right: 0; width: 100%; height: auto; overflow: hidden; }

  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) 12px calc(env(safe-area-inset-left) + 18px);
    background: var(--chrome-solid);
    border-bottom: .5px solid var(--hair);
  }
  .bar h1 { margin: 0; font-size: 30px; font-weight: 680; letter-spacing: -.7px; }
  .count { font-size: 13px; color: var(--muted); padding-bottom: 5px; font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .bar .more { font-size: 20px; line-height: 1; color: var(--muted); padding: 0 4px 6px; }

  main {
    padding: 16px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

  /* Карточка — <button>, поэтому кнопку удаления в неё не вложить:
     обе лежат в .cell. Анимации и data-id живут на ячейке. */
  .cell {
    position: relative; display: flex;
    -webkit-touch-callout: none;
  }
  /* backwards, а не both: иначе конечный transform анимации перебил бы :active */
  .cell.enter { animation: card-in .34s cubic-bezier(.32,.72,0,1) backwards; }
  .cell.leave { animation: card-out .24s ease forwards; pointer-events: none; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  @keyframes card-out {
    to { opacity: 0; transform: scale(.9); }
  }

  /* Фон карточки ставит JS. Поверхность матовая, поэтому никакого
     background-image здесь нет: вычисленный цвет виден как есть. */
  .card {
    flex: 1; display: flex; flex-direction: column; gap: 10px;
    min-height: 136px; padding: 15px 16px; text-align: left;
    border-radius: 26px; color: var(--card-ink);
    box-shadow: var(--edge), var(--lift);
    -webkit-user-select: none; user-select: none;
    transition: transform .16s cubic-bezier(.32,.72,0,1), box-shadow .16s ease;
  }
  .card:active { transform: scale(.975); box-shadow: var(--edge), var(--lift-sm); }

  .trash {
    position: absolute; top: -7px; right: -7px;
    width: 38px; height: 38px; border-radius: 19px;
    display: grid; place-items: center;
    background: var(--danger); color: #fff;
    box-shadow: var(--lift-ctl);
    opacity: 0; transform: scale(.5); pointer-events: none;
    transition: opacity .16s ease, transform .2s cubic-bezier(.32,.72,0,1);
  }
  .cell.armed .trash { opacity: 1; transform: none; pointer-events: auto; }
  .cell.armed .card { transform: scale(.955); box-shadow: var(--edge), var(--lift-sm); }
  .trash:active { transform: scale(.88); }
  .card .text {
    flex: 1; font-size: 15px; line-height: 1.38; white-space: pre-wrap; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6;
    word-break: break-word;
  }
  .card .when { font-size: 11px; opacity: .5; font-variant-numeric: tabular-nums; letter-spacing: .2px; }

  .empty { margin: 22vh 24px 0; text-align: center; color: var(--muted); font-size: 15px; animation: fade-in .4s ease backwards; }
  @keyframes fade-in { from { opacity: 0; } }

  /* Обе стороны заданы, ширина auto — при упоре в max-width поля auto
     центрируют кнопку сами, без transform. */
  .add {
    position: fixed; z-index: 6;
    left: calc(env(safe-area-inset-left) + 16px);
    right: calc(env(safe-area-inset-right) + 16px);
    bottom: calc(env(safe-area-inset-bottom) + 16px);
    max-width: 608px; margin: 0 auto;
    height: 56px; border-radius: 28px;
    background: var(--ctl); color: var(--ctl-ink);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 17px; font-weight: 600; letter-spacing: -.2px;
    box-shadow: var(--lift-ctl);
    transition: transform .16s cubic-bezier(.32,.72,0,1), box-shadow .16s ease;
  }
  .add:active { transform: scale(.985); box-shadow: var(--lift-sm); }
  .add:disabled { opacity: .35; }
  .add .plus { font-size: 21px; font-weight: 300; line-height: 1; margin-top: -2px; }

  .scrim {
    position: fixed; inset: 0; z-index: 10; background: rgba(10,10,12,.3);
    opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility .28s;
  }
  .scrim.open { opacity: 1; visibility: visible; }

  .sheet {
    position: fixed; z-index: 11; left: 0; right: 0; bottom: var(--kb, 0px);
    background: var(--panel-solid);
    border-radius: 34px 34px 0 0;
    padding: 8px 18px calc(env(safe-area-inset-bottom) + 14px);
    box-shadow: var(--edge), var(--lift);
    transform: translateY(110%); visibility: hidden;
    transition: transform .38s cubic-bezier(.32,.72,0,1), visibility .38s;
    max-width: 640px; margin: 0 auto;
  }
  .sheet.open { transform: none; visibility: visible; }
  .grip { width: 36px; height: 5px; border-radius: 3px; background: var(--hair); margin: 6px auto 12px; }

  /* Фрост там, где он поддержан; иначе остаются плотные панели выше. */
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .bar {
      background: var(--chrome);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      backdrop-filter: saturate(180%) blur(24px);
    }
    .sheet {
      background: var(--panel);
      -webkit-backdrop-filter: saturate(180%) blur(30px);
      backdrop-filter: saturate(180%) blur(30px);
    }
    .scrim { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  }

  /* Действия внизу шторки: до них ближе от клавиатуры, чем до верха экрана. */
  .sheet-actions { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
  .icon-btn {
    width: 50px; height: 50px; flex: none; border-radius: 25px;
    display: grid; place-items: center;
    background: var(--fill); color: var(--danger);
    transition: transform .16s cubic-bezier(.32,.72,0,1), background-color .12s ease;
  }
  .icon-btn:active { transform: scale(.92); background: var(--fill-2); }
  .primary {
    flex: 1; height: 50px; border-radius: 25px;
    display: grid; place-items: center;
    background: var(--ctl); color: var(--ctl-ink);
    font-size: 17px; font-weight: 600; letter-spacing: -.2px;
    box-shadow: var(--lift-ctl);
    transition: transform .16s cubic-bezier(.32,.72,0,1), box-shadow .16s ease;
  }
  .primary:active { transform: scale(.985); box-shadow: var(--lift-sm); }

  /* Без рамки и заливки: текст лежит прямо на шторке.
     Высота считается от видимой части экрана минус клавиатура (--kb),
     иначе на айфоне поле уезжает под неё. */
  textarea {
    width: 100%; resize: none;
    height: calc(100vh - var(--kb, 0px) - 264px);
    height: calc(100dvh - var(--kb, 0px) - 264px);
    max-height: 38vh; min-height: 96px;
    border: 0; outline: none; color: inherit; background: transparent;
    font-family: inherit; font-size: 17px; line-height: 1.45; padding: 2px 2px 6px;
  }
  .meta { color: var(--muted); font-size: 12px; padding: 12px 4px 4px; letter-spacing: .1px; }

  .rows { display: flex; flex-direction: column; margin: 0 0 4px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; padding: 15px 14px; font-size: 17px;
    border-radius: 16px;
    transition: background-color .12s ease;
  }
  .row + .row { box-shadow: 0 -.5px 0 var(--hair); }
  .row:active { background-color: var(--fill); box-shadow: none; }
  .row .hint { color: var(--muted); font-size: 13px; }
  .row.center { justify-content: center; color: var(--accent); }

  .toast {
    position: fixed; z-index: 20; left: 50%; transform: translate(-50%, 8px);
    bottom: calc(env(safe-area-inset-bottom) + 88px);
    background: var(--ctl); color: var(--ctl-ink); font-size: 14px;
    padding: 11px 18px; border-radius: 22px; max-width: 84vw; text-align: center;
    box-shadow: var(--lift-ctl);
    opacity: 0; visibility: hidden; transition: opacity .2s ease, transform .2s ease, visibility .2s;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Simple Note</h1>
  <span class="count" id="count"></span>
  <button class="more" id="menuBtn" aria-label="Ещё">•••</button>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Пока пусто.<br>Нажмите «+», чтобы добавить заметку.</p>
</main>

<button class="add" id="addBtn"><span class="plus" aria-hidden="true">+</span>Новая заметка</button>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="editor" role="dialog" aria-modal="true" aria-label="Заметка">
  <div class="grip"></div>
  <textarea id="text" placeholder="Текст заметки" enterkeyhint="enter"></textarea>
  <div class="meta" id="editorMeta"></div>
  <div class="sheet-actions">
    <button class="icon-btn" id="deleteBtn" aria-label="Удалить заметку">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4M6.5 7l.9 12.1a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L17.5 7M10 11v5.5M14 11v5.5"/></svg>
    </button>
    <button class="primary" id="doneBtn">Сохранить</button>
  </div>
</section>

<section class="sheet" id="menu" role="dialog" aria-modal="true" aria-label="Меню">
  <div class="grip"></div>
  <div class="rows">
    <button class="row" id="exportBtn">Экспорт в JSON <span class="hint" id="exportHint"></span></button>
    <button class="row" id="importBtn">Импорт из JSON <span class="hint">слияние по id</span></button>
    <button class="row" id="storageRow" hidden>Хранилище <span class="hint" id="storageHint"></span></button>
    <button class="row center" id="closeMenuBtn">Отмена</button>
  </div>
</section>

<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var MAX_NOTES = 14;
  var LIFETIME = 7 * 24 * 60 * 60 * 1000;
  var SWEEP_INTERVAL = 30 * 1000;
  var KEY = 'simple-notes/v1';

  // Свежая жёлтая → старая серая. Пары «светлая/тёмная» из CLAUDE.md.
  var FRESH = { light: [255, 217, 84], dark: [117, 87, 12] };
  var AGED  = { light: [229, 229, 234], dark: [49, 49, 58] };

  // --- хранилище: localStorage с падением в память -------------------------
  var storage = (function () {
    var mem = {};
    var ls = null;
    try {
      var probe = '__sn_probe__';
      window.localStorage.setItem(probe, probe);
      window.localStorage.removeItem(probe);
      ls = window.localStorage;
    } catch (e) {
      ls = null; // приватный режим Safari, песочница артефакта и т.п.
    }
    return {
      persistent: !!ls,
      get: function (k) {
        try { if (ls) return ls.getItem(k); } catch (e) {}
        return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
      },
      set: function (k, v) {
        mem[k] = v;
        try { if (ls) { ls.setItem(k, v); return true; } } catch (e) {}
        return false;
      }
    };
  })();

  // --- модель --------------------------------------------------------------
  var notes = [];
  var editingId = null;
  var draftIsNew = false;

  function uuid() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      if (window.crypto && crypto.getRandomValues) {
        var b = crypto.getRandomValues(new Uint8Array(16));
        b[6] = (b[6] & 0x0f) | 0x40;
        b[8] = (b[8] & 0x3f) | 0x80;
        var h = [];
        for (var i = 0; i < b.length; i++) h.push((b[i] + 0x100).toString(16).slice(1));
        return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' +
               h.slice(6, 8).join('') + '-' + h.slice(8, 10).join('') + '-' + h.slice(10).join('');
      }
    } catch (e) {}
    return 'n-' + Date.now().toString(16) + '-' + Math.random().toString(16).slice(2, 10);
  }

  function isNote(v) {
    return v && typeof v === 'object' &&
      typeof v.id === 'string' && v.id !== '' &&
      typeof v.text === 'string' &&
      isFinite(Date.parse(v.createdAt));
  }

  function normalize(v) {
    var created = new Date(Date.parse(v.createdAt)).toISOString();
    var updated = isFinite(Date.parse(v.updatedAt)) ? new Date(Date.parse(v.updatedAt)).toISOString() : created;
    return { id: v.id, text: String(v.text), createdAt: created, updatedAt: updated };
  }

  function load() {
    var raw = storage.get(KEY);
    if (!raw) return [];
    try {
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data.filter(isNote).map(normalize);
    } catch (e) {
      return [];
    }
  }

  function save() {
    storage.set(KEY, JSON.stringify(notes));
  }

  function byNewest(a, b) { return Date.parse(b.createdAt) - Date.parse(a.createdAt); }

  // Срок жизни считается от createdAt: правка заметки его не продлевает.
  function isExpired(n, now) { return now - Date.parse(n.createdAt) >= LIFETIME; }

  // Чистка: просроченные исчезают, лишние сверх лимита вытесняются молча.
  function sweep(now) {
    var before = notes.length;
    var kept = [];
    for (var i = 0; i < notes.length; i++) {
      if (!isExpired(notes[i], now)) kept.push(notes[i]);
    }
    kept.sort(byNewest);
    if (kept.length > MAX_NOTES) kept = kept.slice(0, MAX_NOTES);
    var changed = kept.length !== before;
    notes = kept;
    if (changed) save();
    return changed;
  }

  // --- цвет ----------------------------------------------------------------
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { return !!(darkQuery && darkQuery.matches); }

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smoothstep(x) { return x * x * (3 - 2 * x); }

  function cardColor(note, now) {
    var t = smoothstep(clamp01((now - Date.parse(note.createdAt)) / LIFETIME));
    var dark = isDark();
    var a = dark ? FRESH.dark : FRESH.light;
    var b = dark ? AGED.dark : AGED.light;
    var c = [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }

  // --- тексты --------------------------------------------------------------
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function remainingLabel(note, now) {
    var left = LIFETIME - (now - Date.parse(note.createdAt));
    if (left <= 0) return 'истекает';
    var hours = Math.floor(left / 3600000);
    if (hours < 1) {
      var mins = Math.max(1, Math.floor(left / 60000));
      return mins + ' ' + plural(mins, 'минута', 'минуты', 'минут');
    }
    if (hours < 24) return hours + ' ' + plural(hours, 'час', 'часа', 'часов');
    var days = Math.floor(hours / 24);
    return days + ' ' + plural(days, 'день', 'дня', 'дней');
  }

  function stamp(iso) {
    var d = new Date(iso);
    try {
      return d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return d.toISOString().slice(0, 16).replace('T', ' ');
    }
  }

  // --- элементы ------------------------------------------------------------
  var grid = document.getElementById('grid');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var scrim = document.getElementById('scrim');
  var editor = document.getElementById('editor');
  var menu = document.getElementById('menu');
  var textEl = document.getElementById('text');
  var editorMeta = document.getElementById('editorMeta');
  var addBtn = document.getElementById('addBtn');
  var fileInput = document.getElementById('file');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // --- долгое нажатие по карточке ------------------------------------------
  // Кнопка удаления живёт рядом с карточкой и всплывает по удержанию.
  var TRASH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 7h16M10 4h4M6.5 7l.9 12.1a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L17.5 7M10 11v5.5M14 11v5.5"/></svg>';
  var HOLD_MS = 450;

  var armedCell = null;
  var holdTimer = null;
  var holdFrom = null;
  var swallowClick = false;

  function disarm() {
    if (!armedCell) return;
    armedCell.classList.remove('armed');
    armedCell = null;
  }

  function cancelHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    holdFrom = null;
  }

  grid.addEventListener('pointerdown', function (e) {
    swallowClick = false;
    var cell = e.target.closest ? e.target.closest('.cell') : null;
    if (!cell || (e.target.closest && e.target.closest('.trash'))) return;
    holdFrom = { x: e.clientX, y: e.clientY };
    startHold(cell);
  });

  function startHold(cell) {
    holdTimer = setTimeout(function () {
      holdTimer = null;
      disarm();
      cell.classList.add('armed');
      armedCell = cell;
      swallowClick = true; // click после удержания не должен открыть редактор
    }, HOLD_MS);
  }

  grid.addEventListener('pointermove', function (e) {
    if (!holdTimer || !holdFrom) return;
    if (Math.abs(e.clientX - holdFrom.x) > 10 || Math.abs(e.clientY - holdFrom.y) > 10) cancelHold();
  });
  grid.addEventListener('pointerup', cancelHold);
  grid.addEventListener('pointercancel', function () { cancelHold(); });

  // Тап мимо снятой карточки и любая прокрутка снимают взвод.
  document.addEventListener('pointerdown', function (e) {
    if (armedCell && !armedCell.contains(e.target)) disarm();
  }, true);
  window.addEventListener('scroll', function () { cancelHold(); disarm(); }, { passive: true });

  function dropCard(id) {
    disarm();
    var cell = grid.querySelector('[data-id="' + id + '"]');
    if (!cell) { removeNote(id, false); tick(); return; }
    cell.classList.add('leave');
    setTimeout(function () { removeNote(id, false); tick(); }, 240);
  }

  // --- отрисовка -----------------------------------------------------------
  // render() зовётся раз в 30 секунд, поэтому анимация появления вешается
  // только на карточки, которых в прошлой отрисовке не было.
  var shown = Object.create(null);
  var firstPaint = true;
  var lastSig = null;

  function render() {
    var now = Date.now();
    notes.sort(byNewest);

    // Слепок того, что видно. Без него pageshow и focus перерисовывают сетку
    // сразу после старта и сносят анимацию появления, а раз в 30 секунд
    // DOM пересобирается впустую.
    var sig = [];
    for (var k = 0; k < notes.length; k++) {
      sig.push(notes[k].id + '|' + cardColor(notes[k], now) + '|' +
               remainingLabel(notes[k], now) + '|' + notes[k].text);
    }
    sig = sig.join('\n');
    if (sig === lastSig) return;
    lastSig = sig;

    disarm(); // перерисовка отвязывает узел, на который смотрел armedCell
    grid.textContent = '';
    var nextShown = Object.create(null);

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.setAttribute('data-id', n.id);
      nextShown[n.id] = true;
      if (!shown[n.id]) {
        cell.classList.add('enter');
        // Каскад только на первой отрисовке; добавленная заметка выезжает сразу.
        if (firstPaint) cell.style.animationDelay = (i < 8 ? i * 30 : 240) + 'ms';
      }

      var card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.style.backgroundColor = cardColor(n, now);

      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = n.text;
      card.appendChild(text);

      var when = document.createElement('div');
      when.className = 'when';
      when.textContent = remainingLabel(n, now);
      card.appendChild(when);

      var trash = document.createElement('button');
      trash.className = 'trash';
      trash.type = 'button';
      trash.tabIndex = -1;
      trash.setAttribute('aria-label', 'Удалить заметку');
      trash.innerHTML = TRASH_SVG;

      cell.appendChild(card);
      cell.appendChild(trash);
      grid.appendChild(cell);
    }

    shown = nextShown;
    firstPaint = false;

    emptyEl.hidden = notes.length !== 0;
    countEl.textContent = notes.length ? notes.length + ' / ' + MAX_NOTES : '';
  }

  // Чистка при старте, при возврате на экран и раз в 30 секунд —
  // просроченная карточка не должна попасться пользователю на глаза.
  function tick() {
    sweep(Date.now());
    if (editingId && !draftIsNew && !findNote(editingId)) closeSheets(); // открытая заметка истекла
    render();
  }

  function findNote(id) {
    for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i];
    return null;
  }

  // --- клавиатура ------------------------------------------------------------
  // На iOS слой вёрстки не сжимается под клавиатуру: фиксированная шторка
  // уезжает под неё, а Safari вдобавок прокручивает страницу к полю ввода.
  // Лечим двумя вещами: --kb (сколько экрана съедено снизу) и блокировкой
  // прокрутки, пока открыта шторка.
  var vv = window.visualViewport || null;
  var root = document.documentElement;
  var scrollLockY = 0;
  var scrollLocked = false;

  function syncKeyboard() {
    var eaten = 0;
    if (vv) eaten = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--kb', eaten + 'px');
  }

  function lockScroll() {
    if (scrollLocked) return;
    scrollLockY = window.pageYOffset || 0;
    document.body.style.top = (-scrollLockY) + 'px';
    document.body.classList.add('locked');
    scrollLocked = true;
  }

  function unlockScroll() {
    if (!scrollLocked) return;
    document.body.classList.remove('locked');
    document.body.style.top = '';
    scrollLocked = false;
    window.scrollTo(0, scrollLockY); // позиция списка не должна теряться
  }

  if (vv) {
    vv.addEventListener('resize', syncKeyboard);
    vv.addEventListener('scroll', syncKeyboard);
  }

  // --- шторки --------------------------------------------------------------
  function openSheet(el) {
    lockScroll();
    scrim.classList.add('open');
    el.classList.add('open');
  }

  function closeSheets() {
    scrim.classList.remove('open');
    editor.classList.remove('open');
    menu.classList.remove('open');
    editingId = null;
    draftIsNew = false;
    textEl.blur();
    root.style.setProperty('--kb', '0px');
    unlockScroll();
  }

  function openEditor(note) {
    var now = Date.now();
    if (note) {
      editingId = note.id;
      draftIsNew = false;
      textEl.value = note.text;
      editorMeta.textContent = 'Создана ' + stamp(note.createdAt) +
        (note.updatedAt !== note.createdAt ? ' · изменена ' + stamp(note.updatedAt) : '') +
        ' · исчезнет через ' + remainingLabel(note, now);
    } else {
      editingId = uuid();
      draftIsNew = true;
      textEl.value = '';
      editorMeta.textContent = 'Новая заметка · живёт 7 дней' +
        (notes.length >= MAX_NOTES ? ' · вытеснит самую старую' : '');
    }
    openSheet(editor);
    setTimeout(function () { textEl.focus(); }, 80);
  }

  function commitEditor() {
    if (!editingId) return closeSheets();
    var text = textEl.value.trim();
    var nowIso = new Date().toISOString();

    if (draftIsNew) {
      if (text) {
        notes.unshift({ id: editingId, text: text, createdAt: nowIso, updatedAt: nowIso });
        // Пятнадцатая молча вытесняет самую старую.
        notes.sort(byNewest);
        if (notes.length > MAX_NOTES) notes = notes.slice(0, MAX_NOTES);
        save();
      }
    } else {
      var note = findNote(editingId);
      if (note) {
        if (!text) {
          removeNote(editingId, true);
        } else if (note.text !== text) {
          note.text = text;
          note.updatedAt = nowIso; // createdAt не трогаем: срок жизни не продлевается
          save();
        }
      }
    }
    closeSheets();
    tick();
  }

  function removeNote(id, silent) {
    var kept = [];
    for (var i = 0; i < notes.length; i++) if (notes[i].id !== id) kept.push(notes[i]);
    notes = kept;
    save();
    if (!silent) toast('Заметка удалена');
  }

  // --- экспорт / импорт ----------------------------------------------------
  function exportNotes() {
    sweep(Date.now());
    var payload = JSON.stringify(notes, null, 2);
    var name = 'simple-notes-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      var blob = new Blob([payload], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      closeSheets();
      toast('Файл ' + name);
    } catch (e) {
      closeSheets();
      window.prompt('Скопируйте JSON:', payload);
    }
  }

  // Слияние по id: побеждает более свежий updatedAt.
  function mergeNotes(incoming) {
    var index = {};
    var order = [];
    var i, n;
    for (i = 0; i < notes.length; i++) { index[notes[i].id] = notes[i]; order.push(notes[i].id); }

    var added = 0, updated = 0;
    for (i = 0; i < incoming.length; i++) {
      if (!isNote(incoming[i])) continue;
      n = normalize(incoming[i]);
      var cur = index[n.id];
      if (!cur) {
        index[n.id] = n; order.push(n.id); added++;
      } else if (Date.parse(n.updatedAt) > Date.parse(cur.updatedAt)) {
        index[n.id] = n; updated++;
      }
    }

    var merged = [];
    for (i = 0; i < order.length; i++) merged.push(index[order[i]]);
    notes = merged;
    save();
    tick();
    return { added: added, updated: updated };
  }

  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (e) {
        toast('Не удалось разобрать JSON');
        return;
      }
      if (!Array.isArray(data)) { toast('Ожидался массив заметок'); return; }
      var before = notes.length;
      var res = mergeNotes(data);
      var dropped = before + res.added - notes.length;
      toast('Добавлено ' + res.added + ', обновлено ' + res.updated +
            (dropped > 0 ? ', вытеснено ' + dropped : ''));
    };
    reader.onerror = function () { toast('Не удалось прочитать файл'); };
    reader.readAsText(file);
  }

  // --- события -------------------------------------------------------------
  grid.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var cell = e.target.closest('.cell');
    if (!cell) return;
    if (e.target.closest('.trash')) { dropCard(cell.getAttribute('data-id')); return; }
    if (swallowClick) { swallowClick = false; return; }
    if (armedCell) { disarm(); return; }
    var note = findNote(cell.getAttribute('data-id'));
    if (note) openEditor(note);
  });

  addBtn.addEventListener('click', function () { openEditor(null); });
  document.getElementById('doneBtn').addEventListener('click', commitEditor);
  document.getElementById('deleteBtn').addEventListener('click', function () {
    var id = editingId;
    var real = id && !draftIsNew;
    closeSheets();
    // Шторка уезжает 380 мс — за это время карточка успевает съёжиться.
    if (real) dropCard(id); else tick();
  });

  document.getElementById('menuBtn').addEventListener('click', function () { openSheet(menu); });
  document.getElementById('closeMenuBtn').addEventListener('click', closeSheets);
  document.getElementById('exportBtn').addEventListener('click', exportNotes);
  document.getElementById('importBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) importFile(fileInput.files[0]);
    fileInput.value = '';
    closeSheets();
  });

  scrim.addEventListener('click', function () {
    if (editor.classList.contains('open')) commitEditor(); else closeSheets();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (editor.classList.contains('open')) commitEditor(); else closeSheets(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && editor.classList.contains('open')) commitEditor();
  });

  // Возврат на экран: вкладка снова видима, окно в фокусе, страница из bfcache.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  window.addEventListener('focus', tick);
  window.addEventListener('pageshow', tick);
  setInterval(tick, SWEEP_INTERVAL);

  if (darkQuery) {
    var onScheme = function () { render(); };
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', onScheme);
    else if (darkQuery.addListener) darkQuery.addListener(onScheme);
  }

  // --- старт ---------------------------------------------------------------
  notes = load();
  if (!storage.persistent) {
    var row = document.getElementById('storageRow');
    row.hidden = false;
    document.getElementById('storageHint').textContent = 'только в памяти';
  }
  document.getElementById('exportHint').textContent = 'резервная копия';
  tick();
})();
</script>
</body>
</html>
